name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Core tests (parsers, guide, Xtream, search)
        run: swift test
        working-directory: Packages/LuminaCore

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app for iOS Simulator (compile check, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Lumina.xcodeproj -scheme Lumina \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
